name: Mise à jour du calendrier

on:
  schedule:
    - cron: "17 5 * * *"    # tous les jours vers 6h/7h (Paris)
    - cron: "17 21 * * 0"   # dimanche soir pour la semaine suivante
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_calendar.py
      - name: Commit
        run: |
          git config user.name "calendrier-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs data
          git diff --cached --quiet || git commit -m "Mise à jour du calendrier"
          git push
